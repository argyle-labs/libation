[package]
name = "libation"
version = "0.1.0"
edition = "2021"
description = "Audible library downloader — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "libation"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "libation"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.4"
plugin-toolkit = { version = ">=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db"] }
sha2 = "0.10"

[lints.clippy]
let_underscore_must_use = "deny"
